name: Build and Publish Cloudstream Extension

on:
  push:
    branches:
      - master
      - main
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Accept Android SDK Licenses
        run: |
          mkdir -p "$ANDROID_HOME/licenses" || true
          echo -e "\n24333f8a63b6825ea9c5514f83c2829b004d1fee" >> "$ANDROID_HOME/licenses/android-sdk-license" || true
          echo -e "\n84831b9409646a918e30573bab4c9c91346d8abd" >> "$ANDROID_HOME/licenses/android-sdk-preview-license" || true
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.12'

      - name: Warm up JitPack Cache
        run: |
          echo "Triggering JitPack builds..."
          curl -s -m 20 https://jitpack.io/api/builds/com.github.recloudstream/gradle > /dev/null 2>&1 || true
          curl -s -m 20 https://jitpack.io/api/builds/com.github.recloudstream/cloudstream > /dev/null 2>&1 || true

      - name: Build Cloudstream Plugin and Repository
        run: |
          if [ -f "./gradlew" ] && [ -s "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew make makePluginsJson --refresh-dependencies --no-daemon --stacktrace || (
              echo "Retrying after waiting for JitPack build to finish..."
              sleep 15
              ./gradlew make makePluginsJson --refresh-dependencies --no-daemon --stacktrace
            )
          else
            gradle make makePluginsJson --refresh-dependencies --no-daemon --stacktrace || (
              echo "Retrying after waiting for JitPack build to finish..."
              sleep 15
              gradle make makePluginsJson --refresh-dependencies --no-daemon --stacktrace
            )
          fi

      - name: Collect all .cs3 plugins, repo.json and metadata to build folder
        run: |
          mkdir -p ./build
          # Copy tất cả file .cs3 và plugins.json vào ./build an toàn 100%
          find . -maxdepth 4 -name "*.cs3" -exec cp -t ./build/ {} + 2>/dev/null || true
          find . -maxdepth 4 -name "plugins.json" -exec cp -t ./build/ {} + 2>/dev/null || true
          
          # Tự động tạo repo.json chuẩn theo cấu trúc Cloudstream v4 nếu chưa có
          cat << EOF > ./build/repo.json
          {
            "name": "CloudBL - BLVietsub",
            "description": "Kho phim Đam Mỹ BLVietsub Mới Cập Nhật - Tương thích 100% Cloudstream Android TV Box & Mobile.",
            "manifestVersion": 1,
            "pluginLists": [
              "https://raw.githubusercontent.com/${{ github.repository }}/builds/plugins.json"
            ]
          }
          EOF

          # Thêm .nojekyll để GitHub Pages / raw không bỏ qua file
          touch ./build/.nojekyll

          echo "=== Danh sách file trong ./build chuẩn bị đóng gói và xuất bản ==="
          ls -lah ./build

      - name: Upload Artifacts (Cho phép tải trực tiếp file .cs3 từ GitHub Actions)
        uses: actions/upload-artifact@v4
        with:
          name: Cloudstream-BLVietsub-Extension
          path: ./build/
          if-no-files-found: warn

      - name: Deploy plugins.json, repo.json and .cs3 to builds branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build
          publish_branch: builds
          force_orphan: true
